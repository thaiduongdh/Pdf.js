<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPUB Viewer</title>
  <script src="jszip.min.js"></script>
  <script src="epub.min.js"></script>
  <link rel="stylesheet" href="dark-mode.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: #f4f4f4;
      font-family: sans-serif;
    }
    #toolbar {
      background-color: #333;
      color: white;
      padding: 10px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .toolbarButton {
      background: none;
      border: 1px solid #555;
      color: white;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 4px;
    }
    .toolbarButton:hover {
      background-color: #555;
    }
    #viewer {
      flex: 1;
      width: 100%;
      height: calc(100vh - 50px);
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* Dark mode support */
    body.dark-mode {
      background-color: #2a2a2e;
    }
    body.dark-mode #viewer {
      background-color: #2a2a2e;
      color: #e0e0e0;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="prev" class="toolbarButton">Previous</button>
    <button id="next" class="toolbarButton">Next</button>
    <span style="flex: 1;"></span>
    <button id="darkModeToggle" class="toolbarButton">🌙</button>
  </div>
  <div id="viewer"></div>

  <script>
    // Load Dark Mode Script Logic
    const toggleBtn = document.getElementById('darkModeToggle');
    if (localStorage.getItem('pdfjs-dark-mode') === 'dark') {
      document.body.classList.add('dark-mode');
      toggleBtn.innerText = '☀️';
    }

    toggleBtn.onclick = () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('pdfjs-dark-mode', isDark ? 'dark' : 'light');
      toggleBtn.innerText = isDark ? '☀️' : '🌙';
      if (book) {
         applyTheme(isDark);
      }
    };

    function applyTheme(isDark) {
      if (!rendition) return;
      const theme = isDark ? {
        body: { color: '#e0e0e0 !important', background: '#2a2a2e !important' },
        p: { color: '#e0e0e0 !important' }
      } : {
        body: { color: '#000000 !important', background: '#ffffff !important' }
      };
      rendition.themes.register('custom', theme);
      rendition.themes.select('custom');
    }

    // Load Book
    const params = new URLSearchParams(window.location.search);
    const file = params.get('file');
    var book, rendition;

    if (file) {
      book = ePub(file);
      rendition = book.renderTo("viewer", {
        width: "100%",
        height: "100%",
        flow: "paginated"
      });
      rendition.display();

      applyTheme(document.body.classList.contains('dark-mode'));

      // Navigation
      document.getElementById('prev').onclick = () => rendition.prev();
      document.getElementById('next').onclick = () => rendition.next();

      // Keyboard nav
      document.addEventListener('keyup', (e) => {
        if (e.key === "ArrowLeft") rendition.prev();
        if (e.key === "ArrowRight") rendition.next();
      });
    } else {
      document.getElementById('viewer').innerText = "No file specified. Use ?file=/path/to/book.epub";
    }
  </script>
</body>
</html>
