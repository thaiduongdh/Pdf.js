<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EPUB Viewer</title>

  <link rel="stylesheet" href="epub-viewer.css?v=20260212232353" />
  <script src="jszip.min.js"></script>
  <script src="epub.min.js"></script>
  <script src="epub-viewer.js?v=20260212232353" defer></script>
  <script src="drop-handler.js?v=20260223" defer></script>
</head>

<body>
  <div id="app">
    <header id="toolbar">
      <div class="toolgroup">
        <button id="openBtn" class="btn primary" type="button" title="Open an EPUB file">
          Open
        </button>
        <input id="openInput" type="file" accept=".epub" hidden />
      </div>

      <div class="toolgroup">
        <button id="prevBtn" class="btn" type="button" title="Previous (Left Arrow)">
          Prev
        </button>
        <button id="nextBtn" class="btn" type="button" title="Next (Right Arrow)">
          Next
        </button>
      </div>

      <div class="toolgroup">
        <button id="tocBtn" class="btn" type="button" aria-pressed="false" title="Toggle table of contents">
          TOC
        </button>
      </div>

      <div class="toolgroup">
        <input id="searchInput" class="field" type="search" placeholder="Search" />
        <button id="searchBtn" class="btn" type="button" title="Search book">
          Find
        </button>
      </div>

      <div class="spacer"></div>

      <div class="toolgroup">
        <button id="fontMinusBtn" class="btn" type="button" title="Decrease font size">
          A-
        </button>
        <button id="fontPlusBtn" class="btn" type="button" title="Increase font size">
          A+
        </button>
        <button id="fontResetBtn" class="btn" type="button" title="Reset font size">
          A 100%
        </button>
      </div>

      <div class="toolgroup">
        <button id="themeBtn" class="btn" type="button" title="Theme (auto/light/dark)">
          Theme: Auto
        </button>
        <button id="flowBtn" class="btn" type="button" title="Toggle flow (paged/scroll)">
          Flow: Paged
        </button>
        <button id="invertBtn" class="btn" type="button" title="Content inversion (off/mild/full)">
          INV: Off
        </button>
        <button id="resetPosBtn" class="btn" type="button" title="Reset saved position for this book">
          Reset
        </button>
      </div>

      <div id="statusText" class="status"></div>
    </header>

    <div id="content">
      <aside id="sidebar" hidden>
        <div id="sidebarHeader">
          <div id="bookTitle">EPUB</div>
          <button id="closeSidebarBtn" class="btn" type="button" title="Close sidebar">
            Close
          </button>
        </div>

        <div id="sidebarBody">
          <div class="section">
            <h2 class="sectionTitle">Table of Contents</h2>
            <div id="tocList" class="list"></div>
          </div>

          <div class="section">
            <h2 class="sectionTitle">Search</h2>
            <div id="searchStatus" class="status" style="color: var(--muted)"></div>
            <div id="searchResults" class="list"></div>
          </div>
        </div>
      </aside>

      <main id="viewer"></main>
    </div>
  </div>
</body>

</html>
